# BC-RNN, low-dim observations. Hyperparameters follow the robomimic paper's
# low-dim MH settings (robomimic/scripts/generate_paper_configs.py,
# modify_bc_rnn_config_for_dataset + low-dim defaults), except where noted.
algo:
  rnn_horizon: 10          # paper
  rnn_hidden_dim: 400      # paper (low-dim)
  rnn_type: LSTM           # robomimic default
  rnn_num_layers: 2        # robomimic default
  gmm: true                # paper: GMM head for non-mg datasets
  gmm_num_modes: 5         # robomimic default
  lr: 1.0e-4               # paper
train:
  batch_size: 100          # paper
  steps_per_epoch: 100     # paper ("epoch" = 100 gradient steps)
  num_epochs: 1000         # PAPER USES 2000. Reduced after calibration; see docs/METHODS.md
  save_epochs: [200, 400, 600, 800, 1000]
eval:
  # We disable robomimic's in-training rollouts and evaluate saved checkpoints
  # ourselves with fixed env seeds (eval/rollout.py). Reported metric: success of the
  # LAST checkpoint on the held-out seed set. No checkpoint picking on reported rollouts.
  horizon: 500             # robomimic registry horizon for lift/can/square MH
  n_rollouts: 100
  report_seed_base: 100000 # reported rollouts use seeds 100000..100099
  select_seed_base: 200000 # reserved for any tuning; never reported
